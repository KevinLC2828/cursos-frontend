<h2 class="h4 mb-3">Lista de cursos</h2>

<div *ngIf="cursos.length === 0" class="alert alert-warning">
  No hay cursos registrados.
</div>

<table *ngIf="cursos.length > 0" class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Curso</th>
      <th>Docente</th>
      <th>Estado</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let curso of cursos">
      <td>{{ curso.id }}</td>
      <td>{{ curso.nombre }}</td>
      <td>{{ curso.docente }}</td>
      <td>
        <span *ngIf="curso.activo" class="badge bg-success">Activo</span>
        <span *ngIf="!curso.activo" class="badge bg-secondary">Inactivo</span>
      </td>
      <td>
        <button class="btn btn-sm btn-danger" (click)="onEliminar(curso.id)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
